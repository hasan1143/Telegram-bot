<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn BD App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:20px;text-align:center}
.card{background:white;padding:20px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1);margin-bottom:15px}
.btn{background:#0088cc;color:white;padding:12px 20px;border:none;border-radius:10px;width:100%;font-size:16px;margin:5px 0}
.balance{font-size:28px;font-weight:bold;color:#0088cc}
</style>
</head>
<body>
<div class="card">
<h2>💰 Earn BD Official</h2>
<div class="balance" id="bal">৳0</div>
<p>আপনার ব্যালেন্স</p>
</div>
<div class="card">
<button class="btn" onclick="window.open('https://t.me/earn_bd_official_30')">📢 Join Channel - Get ৳5</button>
<button class="btn" style="background:#28a745" onclick="dailyBonus()">🎁 Daily Bonus ৳2</button>
<button class="btn" style="background:#ff9800" onclick="watchAd()">▶️ Watch Ad - Get ৳1</button>
</div>
<div class="card">
<h3>👥 Invite & Earn ৳10</h3>
<p id="refLink">Loading...</p>
<button class="btn" onclick="share()">Share Now</button>
</div>
<script>
let tg = window.Telegram.WebApp;
tg.expand();
let balance = parseInt(localStorage.getItem('bal') || '0');
document.getElementById('bal').innerText = '৳'+balance;
document.getElementById('refLink').innerText = 'https://t.me/your_bot?start='+tg.initDataUnsafe.user.id;
function dailyBonus(){
 balance+=2;
 localStorage.setItem('bal', balance);
 document.getElementById('bal').innerText = '৳'+balance;
 alert('Daily Bonus ৳2 Added!');
}
function watchAd(){
 balance+=1;
 localStorage.setItem('bal', balance);
 document.getElementById('bal').innerText = '৳'+balance;
 alert('Ad watched! ৳1 Added');
}
function share(){
 navigator.clipboard.writeText(document.getElementById('refLink').innerText);
 alert('Refer Link Copied!');
}
</script>
</body>
</html>
